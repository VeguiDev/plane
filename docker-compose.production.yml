name: ancen-plane

x-backend: &backend
  image: ghcr.io/veguidev/plane-backend:${ANCEN_VERSION:?Set a verified Ancen image tag}
  env_file: [.env]
  restart: unless-stopped
  networks: [app, data]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  depends_on:
    plane-db: { condition: service_healthy }
    plane-redis: { condition: service_healthy }
    plane-mq: { condition: service_healthy }
    plane-minio: { condition: service_healthy }

services:
  web:
    image: ghcr.io/veguidev/plane-frontend:${ANCEN_VERSION:?Set a verified Ancen image tag}
    restart: unless-stopped
    networks: [app]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
  admin:
    image: ghcr.io/veguidev/plane-admin:${ANCEN_VERSION:?Set a verified Ancen image tag}
    restart: unless-stopped
    networks: [app]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
  space:
    image: ghcr.io/veguidev/plane-space:${ANCEN_VERSION:?Set a verified Ancen image tag}
    restart: unless-stopped
    networks: [app]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
  live:
    image: ghcr.io/veguidev/plane-live:${ANCEN_VERSION:?Set a verified Ancen image tag}
    restart: unless-stopped
    networks: [app, data]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: ${WEB_URL:?Set the public HTTPS URL}
      LIVE_BASE_URL: ${WEB_URL}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Generate a random secret}
      REDIS_URL: redis://plane-redis:6379/
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('net').connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
      plane-redis: { condition: service_healthy }
  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    healthcheck:
      test: [CMD-SHELL, "celery -A plane inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
  migrator:
    <<: *backend
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    profiles: [maintenance]
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a random database password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    command: valkey-server --appendonly yes
    restart: unless-stopped
    networks: [data]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks: [data]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate a random broker password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?Set RABBITMQ_VHOST}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 30s
      timeout: 15s
      retries: 10
  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /export --console-address :9090
    restart: unless-stopped
    networks: [app]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Generate an object storage access key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Generate an object storage secret}
    volumes: [uploads:/export]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    image: ghcr.io/veguidev/plane-proxy:${ANCEN_VERSION:?Set a verified Ancen image tag}
    restart: unless-stopped
    networks: [edge, app]
    security_opt: [no-new-privileges:true]
    ports:
      - "${LISTEN_ADDRESS:-127.0.0.1}:${LISTEN_HTTP_PORT:-8080}:80"
      - "${LISTEN_ADDRESS:-127.0.0.1}:${LISTEN_HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      CERT_EMAIL: ${CERT_EMAIL:-}
    volumes: [caddy_data:/data, caddy_config:/config]
    healthcheck:
      test: [CMD-SHELL, "curl -fkSs http://localhost/ >/dev/null || curl -fkSs https://localhost/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      web: { condition: service_started }
      admin: { condition: service_started }
      space: { condition: service_started }
      live: { condition: service_healthy }

networks:
  edge:
  app:
  data:
    internal: true
volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  caddy_data:
  caddy_config:
