name: Ancen images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ancen-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ancen-ci.yml
  build:
    needs: checks
    if: github.repository == 'VeguiDev/plane'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        component: [frontend, admin, space, live, backend, proxy]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: config
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            frontend) context=.; file=apps/web/Dockerfile.web ;;
            admin) context=.; file=apps/admin/Dockerfile.admin ;;
            space) context=.; file=apps/space/Dockerfile.space ;;
            live) context=.; file=apps/live/Dockerfile.live ;;
            backend) context=apps/api; file=apps/api/Dockerfile.api ;;
            proxy) context=apps/proxy; file=apps/proxy/Dockerfile.ce ;;
          esac
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(cat .ancen/version)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(jq -r .version .ancen/upstream.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/veguidev/plane-${{ matrix.component }}
          tags: type=raw,value=sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Ancen Plane ${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/VeguiDev/plane
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.ancen.upstream=${{ steps.config.outputs.upstream }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.file }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=/tmp/image.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish only the scanned OCI archive, preserving attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all --preserve-digests oci-archive:/tmp/image.tar "docker://ghcr.io/veguidev/plane-$COMPONENT:sha-$GITHUB_SHA-$ARCH"
  manifests:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [frontend, admin, space, live, backend, proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Publish candidate manifests and keyless signature (never latest)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/veguidev/plane-$COMPONENT"
          version=$(cat .ancen/version)
          upstream=$(jq -r .version .ancen/upstream.json)
          tags=(-t "$image:sha-$GITHUB_SHA" -t "$image:upstream-$upstream-$version")
          if [[ "$version" == *-* ]]; then tags+=(-t "$image:$version"); fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$image@$digest"
