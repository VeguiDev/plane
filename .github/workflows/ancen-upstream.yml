name: Ancen upstream sync
on:
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: ancen-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'VeguiDev/plane'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ancen/upstream_sync.py
