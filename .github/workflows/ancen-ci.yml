name: Ancen CI
on:
  workflow_call:
  push:
    branches: [main, "feature/**", "upstream-sync/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ancen-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oidc:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: oidctest
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: oidctest
        ports: ["5432:5432"]
        options: --health-cmd='pg_isready -U oidctest' --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports: ["6379:6379"]
        options: --health-cmd='valkey-cli ping' --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      DATABASE_URL: postgresql://oidctest:isolated-test-only@localhost:5432/oidctest
      REDIS_URL: redis://localhost:6379/
      SECRET_KEY: isolated-test-only-not-production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s ../../scripts/ancen -p 'test_*.py'
      - run: uv run ruff check plane/authentication/oidc.py plane/authentication/middleware/oidc.py plane/authentication/views/oidc.py plane/authentication/management plane/db/models/oidc.py plane/settings/oidc.py plane/tests/oidc
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest plane/tests/oidc/ -q
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm check:lint
      - run: pnpm build
